<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Dart Hub Camera Calibration
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            min-height: 100%;

            background:
                radial-gradient(
                    circle at top,
                    #162733,
                    #050708 55%
                );

            color: white;

            font-family:
                Arial,
                sans-serif;
        }


        body {

            padding: 12px;

            text-align: center;
        }


        h1 {

            color: #00aaff;
        }


        .card {

            max-width: 1100px;

            margin:
                12px auto;

            padding: 12px;

            border:
                1px solid #293941;

            border-radius: 12px;

            background: #0b1013;
        }


        .join-row {

            display: grid;

            grid-template-columns:
                1fr auto;

            gap: 8px;

            max-width: 500px;

            margin: auto;
        }


        input {

            min-height: 50px;

            padding: 10px;

            border:
                1px solid #44545b;

            border-radius: 8px;

            background: #020303;

            color: white;

            font-size: 21px;

            font-weight: bold;

            text-align: center;

            text-transform: uppercase;

            letter-spacing: 4px;
        }


        button {

            min-height: 48px;

            padding:
                8px 14px;

            border: none;

            border-radius: 8px;

            background: #0078b8;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }


        .secondary {

            background: #087247;
        }


        .warning {

            background: #782323;
        }


        .image-wrap {

            position: relative;

            overflow: auto;

            max-height: 75vh;

            background: black;

            border-radius: 10px;
        }


        #calibration-canvas {

            display: block;

            max-width: 100%;

            margin: auto;

            cursor: crosshair;
        }


        .controls {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 7px;

            margin-top: 9px;
        }


        .status {

            margin-top: 8px;

            color: #96a8b0;
        }


        .current-point {

            margin: 9px 0;

            color: #00ff9d;

            font-size: 20px;

            font-weight: 900;
        }


        .slider-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap: 9px;

            text-align: left;
        }


        .slider-grid label {

            padding: 7px;

            border-radius: 7px;

            background: #11181b;
        }


        .slider-grid input {

            width: 100%;

            min-height: auto;

            padding: 0;

            letter-spacing: 0;
        }


        .detected {

            color: #00ff9d;

            font-size: 30px;

            font-weight: 900;
        }


        @media (
            max-width:700px
        ) {

            .join-row,
            .controls,
            .slider-grid {

                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>


<body
    data-camera-page="calibrate"
>


<h1>
    🎯 Dart Hub Camera Calibration
</h1>


<div class="card">

    <div class="join-row">

        <input
            id="calibration-code"
            maxlength="6"
            placeholder="ABC123"
        >


        <button
            id="connect-camera"
        >
            Connect
        </button>

    </div>


    <div
        id="calibration-status"
        class="status"
    >

        Enter the code shown on the phone.

    </div>

</div>


<div
    id="calibration-area"
    class="card"
    style="display:none"
>

    <div
        id="current-point"
        class="current-point"
    >
        Waiting for picture…
    </div>


    <div class="image-wrap">

        <canvas
            id="calibration-canvas"
        ></canvas>

    </div>


    <div class="controls">

        <button
            id="undo-point"
            class="warning"
        >
            ↶ Undo Point
        </button>


        <button
            id="reset-points"
            class="warning"
        >
            Reset Calibration
        </button>


        <button
            id="preview-grid"
            class="secondary"
        >
            👁 Preview Grid
        </button>

    </div>

</div>


<div
    id="ring-settings"
    class="card"
    style="display:none"
>

    <h2>
        Fine Tune Rings
    </h2>


    <div class="slider-grid">

        <label>

            Outer Bull

            <input
                id="outer-bull-ratio"
                type="range"
                min="0.05"
                max="0.16"
                step="0.001"
                value="0.094"
            >

            <span id="outer-bull-value">
                0.094
            </span>

        </label>


        <label>

            Treble Inner

            <input
                id="treble-inner-ratio"
                type="range"
                min="0.45"
                max="0.70"
                step="0.001"
                value="0.582"
            >

            <span id="treble-inner-value">
                0.582
            </span>

        </label>


        <label>

            Treble Outer

            <input
                id="treble-outer-ratio"
                type="range"
                min="0.50"
                max="0.75"
                step="0.001"
                value="0.629"
            >

            <span id="treble-outer-value">
                0.629
            </span>

        </label>


        <label>

            Double Inner

            <input
                id="double-inner-ratio"
                type="range"
                min="0.85"
                max="0.99"
                step="0.001"
                value="0.953"
            >

            <span id="double-inner-value">
                0.953
            </span>

        </label>

    </div>


    <button
        id="save-calibration"
        class="secondary"
    >
        💾 Save Calibration
    </button>

</div>


<div
    id="live-detection"
    class="card"
    style="display:none"
>

    <div>
        PHONE DETECTION
    </div>


    <div
        id="pc-detected-dart"
        class="detected"
    >
        Waiting…
    </div>


    <div
        id="pc-detected-confidence"
        class="status"
    ></div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script
    src="camera.js"
></script>


</body>

</html>
